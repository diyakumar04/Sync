<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sync — Group Project Coordinator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F4F0;color:#2C2C2A;min-height:100vh}
.topbar{background:#fff;border-bottom:0.5px solid #E0DED6;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:600;letter-spacing:-0.5px;color:#2C2C2A}.logo span{color:#7F77DD}
.nav{display:flex;gap:4px}
.nav-btn{padding:7px 14px;border-radius:8px;border:none;background:none;font-size:13px;color:#888780;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:#F1EFE8;color:#2C2C2A}
.nav-btn.active{background:#EEEDFE;color:#534AB7;font-weight:500}
.content{max-width:800px;margin:0 auto;padding:24px 20px}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:0.5px solid #E0DED6;border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:500;color:#2C2C2A;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.metric{background:#F5F4F0;border-radius:8px;padding:14px 16px}
.metric-label{font-size:12px;color:#888780;margin-bottom:4px}
.metric-value{font-size:24px;font-weight:500;color:#2C2C2A}
.member-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid #F1EFE8}
.member-row:last-child{border-bottom:none}
.avatar{width:38px;height:38px;border-radius:50%;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#534AB7;flex-shrink:0}
.member-info{flex:1}
.member-name{font-size:13px;font-weight:500;color:#2C2C2A}
.member-contact{font-size:12px;color:#888780}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid #F1EFE8}
.task-row:last-child{border-bottom:none}
.task-check{width:18px;height:18px;border-radius:4px;border:1px solid #D3D1C7;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.task-check.done{background:#7F77DD;border-color:#7F77DD}
.task-text{flex:1;font-size:13px;color:#2C2C2A}
.task-text.done{text-decoration:line-through;color:#B4B2A9}
.task-assignee{font-size:11px;color:#888780;background:#F5F4F0;padding:2px 8px;border-radius:10px}
.task-due{font-size:11px;color:#B4B2A9;min-width:70px;text-align:right}
.input-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.input-row input,.input-row select{flex:1;min-width:120px;font-size:13px;padding:8px 10px;border:0.5px solid #D3D1C7;border-radius:8px;background:#fff;color:#2C2C2A;outline:none}
.input-row input:focus,.input-row select:focus{border-color:#7F77DD}
.btn{padding:8px 16px;border-radius:8px;border:0.5px solid #D3D1C7;background:#fff;color:#2C2C2A;font-size:13px;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.btn:hover{background:#F5F4F0}
.btn-primary{background:#7F77DD;border-color:#7F77DD;color:#fff}
.btn-primary:hover{background:#534AB7;border-color:#534AB7}
.meeting-slot{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid #F1EFE8;flex-wrap:wrap}
.meeting-slot:last-child{border-bottom:none}
.slot-time{font-size:13px;font-weight:500;color:#2C2C2A;min-width:130px}
.slot-votes{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.vote-pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#E1F5EE;color:#0F6E56}
.vote-pill.no{background:#F5F4F0;color:#B4B2A9}
.project-card{background:#fff;border:0.5px solid #E0DED6;border-radius:12px;padding:16px 18px;margin-bottom:12px}
.project-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.project-name{font-size:14px;font-weight:500;color:#2C2C2A}
.project-due{font-size:12px;color:#888780}
.progress-bar{height:4px;background:#F1EFE8;border-radius:2px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:#7F77DD;border-radius:2px;transition:width 0.4s}
.empty{text-align:center;padding:20px;color:#B4B2A9;font-size:13px}
.share-box{background:#EEEDFE;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.share-text{font-size:13px;color:#534AB7}
.share-link{font-size:12px;color:#7F77DD;background:#fff;padding:4px 12px;border-radius:6px;border:0.5px solid #AFA9EC;cursor:pointer}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Sy<span>nc</span></div>
  <div class="nav">
    <button class="nav-btn active" onclick="showTab('dashboard',this)"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
    <button class="nav-btn" onclick="showTab('members',this)"><i class="ti ti-users"></i> Team</button>
    <button class="nav-btn" onclick="showTab('tasks',this)"><i class="ti ti-check"></i> Tasks</button>
    <button class="nav-btn" onclick="showTab('schedule',this)"><i class="ti ti-calendar"></i> Schedule</button>
    <button class="nav-btn" onclick="showTab('projects',this)"><i class="ti ti-folder"></i> Projects</button>
  </div>
</div>

<div class="content">

  <div id="tab-dashboard" class="section active">
    <div class="grid2">
      <div class="metric"><div class="metric-label">Team members</div><div class="metric-value" id="m-members">4</div></div>
      <div class="metric"><div class="metric-label">Tasks complete</div><div class="metric-value" id="m-tasks">2 / 5</div></div>
      <div class="metric"><div class="metric-label">Active projects</div><div class="metric-value" id="m-projects">2</div></div>
      <div class="metric"><div class="metric-label">Next meeting</div><div class="metric-value" style="font-size:16px" id="m-meeting">Thu 4pm</div></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-clock"></i> Upcoming deadlines</div>
      <div id="deadline-list"></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-check"></i> My tasks</div>
      <div id="my-tasks-list"></div>
    </div>
  </div>

  <div id="tab-members" class="section">
    <div class="share-box">
      <div class="share-text"><i class="ti ti-link"></i> Share this link with your group to let them add their info</div>
      <div class="share-link" onclick="alert('In the deployed version, this copies a shareable link!')">Copy invite link</div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-users"></i> Team members</div>
      <div id="member-list"></div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-user-plus"></i> Add member</div>
      <div class="input-row">
        <input id="m-name" placeholder="Full name" />
        <input id="m-phone" placeholder="Phone number" />
        <input id="m-email" placeholder="Email" />
        <button class="btn btn-primary" onclick="addMember()">Add</button>
      </div>
    </div>
  </div>

  <div id="tab-tasks" class="section">
    <div class="card">
      <div class="card-title"><i class="ti ti-list"></i> All tasks</div>
      <div id="task-list"></div>
      <div class="input-row">
        <input id="t-name" placeholder="Task description" style="min-width:180px" />
        <select id="t-assignee" style="min-width:110px"></select>
        <input id="t-due" type="date" style="min-width:130px" />
        <button class="btn btn-primary" onclick="addTask()">Add task</button>
      </div>
    </div>
  </div>

  <div id="tab-schedule" class="section">
    <div class="card">
      <div class="card-title"><i class="ti ti-calendar"></i> Meeting availability</div>
      <div id="slot-list"></div>
      <div class="input-row">
        <input id="s-time" placeholder="e.g. Thursday 4:00pm" />
        <button class="btn btn-primary" onclick="addSlot()">Propose time</button>
      </div>
    </div>
  </div>

  <div id="tab-projects" class="section">
    <div id="project-list"></div>
    <div class="card">
      <div class="card-title"><i class="ti ti-folder-plus"></i> Add project</div>
      <div class="input-row">
        <input id="p-name" placeholder="Project name" />
        <input id="p-class" placeholder="Class" />
        <input id="p-due" type="date" />
        <button class="btn btn-primary" onclick="addProject()">Add</button>
      </div>
    </div>
  </div>

</div>

<script>
let members=[
  {name:"Diya Kumar",phone:"(484) 354-0125",email:"dikumar@iu.edu"},
  {name:"Priya Shah",phone:"(312) 555-0182",email:"pshah@iu.edu"},
  {name:"Marcus Lee",phone:"(917) 555-0134",email:"mlee@iu.edu"},
  {name:"Jordan Kim",phone:"(773) 555-0198",email:"jkim@iu.edu"},
];
let tasks=[
  {text:"Research competitive landscape",assignee:"Diya Kumar",due:"2026-06-01",done:true},
  {text:"Build slide deck outline",assignee:"Priya Shah",due:"2026-06-03",done:true},
  {text:"Write executive summary",assignee:"Marcus Lee",due:"2026-06-05",done:false},
  {text:"Data analysis & visualizations",assignee:"Diya Kumar",due:"2026-06-07",done:false},
  {text:"Final presentation rehearsal",assignee:"Jordan Kim",due:"2026-06-10",done:false},
];
let slots=[
  {time:"Thu 4:00pm",votes:["Diya Kumar","Priya Shah","Marcus Lee"]},
  {time:"Fri 2:00pm",votes:["Diya Kumar","Jordan Kim"]},
  {time:"Sat 11:00am",votes:["Priya Shah","Marcus Lee","Jordan Kim"]},
];
let projects=[
  {name:"IS Strategy Analysis",cls:"BUS-I 430",due:"2026-06-15",tasks:2,total:3},
  {name:"Digital Marketing Plan",cls:"MKTG 305",due:"2026-06-20",tasks:0,total:2},
];

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2)}

function showTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  render();
}

function render(){
  renderMembers();renderTasks();renderSlots();renderProjects();renderDashboard();renderAssigneeSelect();
}

function renderMembers(){
  const el=document.getElementById('member-list');
  if(!members.length){el.innerHTML='<div class="empty">No members yet — add your team above</div>';return;}
  el.innerHTML=members.map(m=>`
    <div class="member-row">
      <div class="avatar">${initials(m.name)}</div>
      <div class="member-info">
        <div class="member-name">${m.name}</div>
        <div class="member-contact">${m.phone} · ${m.email}</div>
      </div>
    </div>`).join('');
}

function renderTasks(){
  const el=document.getElementById('task-list');
  if(!tasks.length){el.innerHTML='<div class="empty">No tasks yet</div>';return;}
  el.innerHTML=tasks.map((t,i)=>`
    <div class="task-row">
      <div class="task-check ${t.done?'done':''}" onclick="toggleTask(${i})">
        ${t.done?'<i class="ti ti-check" style="font-size:11px;color:#fff"></i>':''}
      </div>
      <div class="task-text ${t.done?'done':''}">${t.text}</div>
      <div class="task-assignee">${t.assignee.split(' ')[0]}</div>
      <div class="task-due">${t.due}</div>
    </div>`).join('');
}

function renderSlots(){
  const el=document.getElementById('slot-list');
  if(!slots.length){el.innerHTML='<div class="empty">No times proposed yet</div>';return;}
  el.innerHTML=slots.map(s=>`
    <div class="meeting-slot">
      <div class="slot-time">${s.time}</div>
      <div class="slot-votes">
        ${members.map(m=>`<span class="vote-pill ${s.votes.includes(m.name)?'':'no'}">${m.name.split(' ')[0]}</span>`).join('')}
      </div>
      <div style="font-size:12px;color:#888780;white-space:nowrap">${s.votes.length}/${members.length} free</div>
    </div>`).join('');
}

function renderProjects(){
  const el=document.getElementById('project-list');
  if(!projects.length){el.innerHTML='';return;}
  el.innerHTML=projects.map(p=>`
    <div class="project-card">
      <div class="project-header">
        <div class="project-name">${p.name}</div>
        <div class="project-due">Due ${p.due}</div>
      </div>
      <div style="font-size:12px;color:#888780">${p.cls} · ${p.tasks}/${p.total} tasks done</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p.total?Math.round(p.tasks/p.total*100):0}%"></div></div>
    </div>`).join('');
}

function renderDashboard(){
  document.getElementById('m-members').textContent=members.length;
  const done=tasks.filter(t=>t.done).length;
  document.getElementById('m-tasks').textContent=`${done} / ${tasks.length}`;
  document.getElementById('m-projects').textContent=projects.length;
  const best=[...slots].sort((a,b)=>b.votes.length-a.votes.length)[0];
  document.getElementById('m-meeting').textContent=best?best.time:'—';
  const deadlines=[...projects].sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3);
  document.getElementById('deadline-list').innerHTML=deadlines.length?deadlines.map(p=>`
    <div class="task-row">
      <i class="ti ti-folder" style="font-size:16px;color:#888780"></i>
      <div class="task-text">${p.name}</div>
      <div class="task-due">${p.due}</div>
    </div>`).join(''):'<div class="empty">No projects yet</div>';
  const mine=tasks.filter(t=>t.assignee==="Diya Kumar"&&!t.done);
  document.getElementById('my-tasks-list').innerHTML=mine.length?mine.map(t=>`
    <div class="task-row">
      <div class="task-check" onclick="toggleMyTask('${t.text}')"></div>
      <div class="task-text">${t.text}</div>
      <div class="task-due">${t.due}</div>
    </div>`).join(''):'<div class="empty">All caught up!</div>';
}

function renderAssigneeSelect(){
  const sel=document.getElementById('t-assignee');
  sel.innerHTML=members.map(m=>`<option>${m.name}</option>`).join('');
}

function toggleTask(i){tasks[i].done=!tasks[i].done;render();}
function toggleMyTask(text){const t=tasks.find(t=>t.text===text);if(t)t.done=true;render();}

function addMember(){
  const n=document.getElementById('m-name').value.trim();
  const p=document.getElementById('m-phone').value.trim();
  const e=document.getElementById('m-email').value.trim();
  if(!n)return;
  members.push({name:n,phone:p||'—',email:e||'—'});
  ['m-name','m-phone','m-email'].forEach(id=>document.getElementById(id).value='');
  render();
}

function addTask(){
  const t=document.getElementById('t-name').value.trim();
  const a=document.getElementById('t-assignee').value;
  const d=document.getElementById('t-due').value;
  if(!t)return;
  tasks.push({text:t,assignee:a,due:d||'TBD',done:false});
  document.getElementById('t-name').value='';
  document.getElementById('t-due').value='';
  render();
}

function addSlot(){
  const t=document.getElementById('s-time').value.trim();
  if(!t)return;
  slots.push({time:t,votes:[]});
  document.getElementById('s-time').value='';
  render();
}

function addProject(){
  const n=document.getElementById('p-name').value.trim();
  const c=document.getElementById('p-class').value.trim();
  const d=document.getElementById('p-due').value;
  if(!n)return;
  projects.push({name:n,cls:c||'—',due:d||'TBD',tasks:0,total:0});
  ['p-name','p-class','p-due'].forEach(id=>document.getElementById(id).value='');
  render();
}

render();
</script>
</body>
</html>
